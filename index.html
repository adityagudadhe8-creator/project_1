<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101224">
  <title>Hello, World — A Little Moment of Wonder</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f7ff;
      --muted: #b6b5ca;
      --violet: #b39aff;
      --mint: #a5f3d2;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 110%, rgba(110, 79, 199, .25), transparent 48%),
        radial-gradient(ellipse at 85% 14%, rgba(68, 154, 156, .14), transparent 36%),
        #101224;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stars, .stars::before, .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 14% 22%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 83% 29%, #d5ccff 98%, transparent),
        radial-gradient(1px 1px at 73% 78%, #fff 98%, transparent),
        radial-gradient(1px 1px at 24% 76%, #a5f3d2 98%, transparent),
        radial-gradient(1px 1px at 91% 63%, #fff 98%, transparent),
        radial-gradient(1px 1px at 39% 14%, #d5ccff 98%, transparent);
      background-size: 360px 310px;
      opacity: .48;
      animation: twinkle 6s ease-in-out infinite alternate;
    }
    .stars::before { transform: translate(90px, 65px); opacity: .5; animation-delay: -3s; }
    .stars::after { transform: translate(-55px, 120px); opacity: .35; animation-delay: -1.5s; }
    main {
      position: relative;
      width: min(760px, calc(100% - 40px));
      padding: clamp(42px, 8vw, 82px) 28px;
      text-align: center;
      animation: arrive 1.1s cubic-bezier(.2,.75,.25,1) both;
    }
    .orb {
      width: 76px;
      height: 76px;
      margin: 0 auto 33px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, rgba(179,154,255,.32), rgba(165,243,210,.12));
      box-shadow: 0 0 50px rgba(179,154,255,.2), inset 0 0 24px rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      font-size: 29px;
      animation: float 5s ease-in-out infinite;
    }
    .eyebrow {
      margin: 0 0 17px;
      color: var(--mint);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(56px, 11vw, 104px);
      line-height: .98;
      font-weight: 720;
      letter-spacing: -.075em;
      background: linear-gradient(110deg, #fff 20%, #d9ccff 56%, #a5f3d2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 35px rgba(179,154,255,.14));
    }
    .subtitle {
      max-width: 440px;
      margin: 25px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 19px);
      line-height: 1.7;
      font-weight: 400;
    }
    .rule {
      width: 54px;
      height: 1px;
      margin: 34px auto 20px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
    }
    .footnote { color: #85849c; font-size: 13px; letter-spacing: .04em; }
    .footnote span { color: var(--violet); }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 50% { transform: translateY(-7px); } }
    @keyframes twinkle { to { opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <div class="orb" aria-hidden="true">✦</div>
    <p class="eyebrow">A small beginning</p>
    <h1>Hello,<br>world.</h1>
    <p class="subtitle">Every great idea starts somewhere.<br>Here’s to what comes next.</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="footnote">Made with <span>✦</span> and a little curiosity</p>
  </main>
</body>
</html>
