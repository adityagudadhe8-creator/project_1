<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101224">
  <title>Contact — A Little Moment of Wonder</title>
  <style>
    :root{color-scheme:dark;--ink:#f8f7ff;--muted:#b6b5ca;--violet:#b39aff;--mint:#a5f3d2}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:110px 20px 50px;color:var(--ink);background:radial-gradient(ellipse at 50% 110%,rgba(110,79,199,.25),transparent 48%),radial-gradient(ellipse at 85% 14%,rgba(68,154,156,.14),transparent 36%),#101224;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .site-nav{position:absolute;top:28px;right:clamp(20px,5vw,64px);display:flex;gap:10px;padding:7px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.055);backdrop-filter:blur(12px)}.site-nav a{padding:9px 15px;border-radius:999px;color:#d2d0e2;text-decoration:none;font-size:13px;transition:color .2s,background .2s}.site-nav a:hover,.site-nav a[aria-current=page]{color:#fff;background:rgba(179,154,255,.2)}
    .stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 14% 22%,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 83% 29%,#d5ccff 98%,transparent),radial-gradient(1px 1px at 73% 78%,#fff 98%,transparent),radial-gradient(1px 1px at 24% 76%,#a5f3d2 98%,transparent);background-size:360px 310px;opacity:.4}
    main{position:relative;width:min(760px,100%);padding:clamp(32px,7vw,66px);border:1px solid rgba(255,255,255,.12);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 30px 100px rgba(0,0,0,.25);backdrop-filter:blur(14px);animation:arrive .8s both}.eyebrow{margin:0 0 14px;color:var(--mint);font-size:12px;font-weight:650;letter-spacing:.24em;text-transform:uppercase}h1{margin:0;font-size:clamp(48px,9vw,76px);line-height:1;letter-spacing:-.07em;background:linear-gradient(110deg,#fff 20%,#d9ccff 56%,#a5f3d2);-webkit-background-clip:text;background-clip:text;color:transparent}.lead{margin:22px 0 0;color:#e5e2f2;font-size:clamp(18px,3vw,22px);line-height:1.65}.copy{max-width:590px;margin:17px 0 0;color:var(--muted);font-size:16px;line-height:1.8}.contact-link{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:14px 19px;border:1px solid rgba(165,243,210,.32);border-radius:14px;color:#eafff6;text-decoration:none;background:rgba(165,243,210,.09);transition:transform .2s,background .2s}.contact-link:hover{transform:translateY(-2px);background:rgba(165,243,210,.16)}.hint{margin:14px 0 0;color:#85849c;font-size:13px}@keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}@media(max-width:480px){.site-nav{top:18px;right:50%;transform:translateX(50%);white-space:nowrap}main{padding:30px 24px}}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <p class="eyebrow">We’d love to hear from you</p>
    <h1>Say hello Us.</h1>
    <p class="lead">Questions, ideas, or just stopping by? Our inbox is open.</p>
    <p class="copy">Send a note and let us know what’s on your mind. We’ll be happy to hear from you.</p>
    <a class="contact-link" href="mailto:hello@example.com"><span aria-hidden="true">✉</span> Email us <span aria-hidden="true">↗</span></a>
    <p class="hint">Replace hello@example.com with your email address.</p>
  </main>
</body>
</html>
